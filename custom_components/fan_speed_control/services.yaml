sync_state:
  name: Synchronize state
  description: Record speed without transmitting commands. Use either the percentage slider or a percentage template (0 means off). Omitted oscillation keeps its current estimate.
  target:
    entity:
      integration: fan_speed_control
      domain: fan
  fields:
    percentage:
      name: Percentage
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
    percentage_template:
      name: Percentage template
      description: Return a percentage from 0 to 100, for example {{ states('sensor.actual_fan_speed') }}. Leave the percentage slider unset when using this field.
      example: "{{ states('sensor.actual_fan_speed') }}"
      selector:
        template:
    oscillating:
      name: Oscillating
      selector:
        boolean:
calibrate:
  name: Calibrate speed
  description: Repeat speed commands for at least 10 seconds to reach an endpoint, then synchronize the speed. Turns on a fan known to be off. Only use with directions that stop at the endpoint, not wrap around.
  target:
    entity:
      integration: fan_speed_control
      domain: fan
  fields:
    direction:
      name: Direction
      required: true
      default: increase
      selector:
        select:
          options:
            - label: Maximum speed (up)
              value: increase
            - label: Minimum speed (down)
              value: decrease
