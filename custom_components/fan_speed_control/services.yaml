sync_state:
  name: Synchronize state
  description: Record speed without transmitting commands. Use either the percentage slider or a percentage template (0 means off). Omitted oscillation keeps its current estimate.
  target:
    entity:
      integration: fan_speed_control
      domain: fan
  fields:
    percentage:
      name: Percentage
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
    percentage_template:
      name: Percentage template
      description: Return a percentage from 0 to 100, for example {{ states('sensor.actual_fan_speed') }}. Leave the percentage slider unset when using this field.
      example: "{{ states('sensor.actual_fan_speed') }}"
      selector:
        template:
    oscillating:
      name: Oscillating
      selector:
        boolean:
calibrate:
  name: Calibrate fan
  description: Repeat only speed-up commands for at least 10 seconds, then record maximum speed (speed 10 / 100% for a ten-speed fan). Speed-up powers on the fan automatically; no power-toggle command is sent. Increasing must stop at maximum, not wrap.
  target:
    entity:
      integration: fan_speed_control
      domain: fan
